<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GTA 6 — monitor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.live { cursor: none; }
  #v, #c { position: absolute; inset: 0; width: 100%; height: 100%; }
  #v { object-fit: cover; }
  #c { display: none; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
           background: rgba(0,0,0,.88); color: #fff; font: 16px/1.5 system-ui, sans-serif; cursor: pointer; text-align: center; }
  #start b { font-size: 26px; }
</style>
</head>
<body>
<video id="v" src="intro.mp4" preload="auto" playsinline></video>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="start">
  <b>Нажми, чтобы начать</b>
</div>

<script src="../assets/mqtt.min.js"></script>
<script>
/* ---------- shared with the phone app ---------- */
const PANO = { src: '../assets/panorama.jpg', W: 2340, H: 1532, f: 1136, cx: 1170, cy: 760 };
const params = new URLSearchParams(location.search);
const VFOV = (+params.get('fov') || 45) * Math.PI / 180;     // vertical field of view on the monitor
const SMOOTH = +params.get('smooth') || 0.3;                   // 1 = no smoothing

const v = document.getElementById('v'), c = document.getElementById('c'), fade = document.getElementById('fade');
const start = document.getElementById('start');
let state = 'setup';            // setup → ready → playing → held → pano

/* ---------- start overlay (gives the page a user gesture for fullscreen + sound) ---------- */
start.addEventListener('click', () => {
  document.documentElement.requestFullscreen?.().catch(() => {});
  start.style.display = 'none'; document.body.classList.add('live');
  reset();
});

/* ---------- flow ---------- */
function reset() {
  state = 'ready';
  v.pause(); v.currentTime = 0; v.style.display = 'block'; c.style.display = 'none';
  fade.style.opacity = 0;
}
/* intro plays only while a stick is moved (or Space is held), pauses when released */
let stickActive = false, spaceHeld = false;
function driveIntro() {
  if (state !== 'ready' && state !== 'playing') return;
  const go = stickActive || spaceHeld;
  if (go && v.paused && !v.ended) { state = 'playing'; v.play().catch(() => { v.muted = true; v.play(); }); }
  else if (!go && !v.paused) v.pause();
}
v.addEventListener('ended', () => { if (state === 'playing') state = 'held'; });
function toPano() {
  if (state !== 'held') return;
  state = 'fading';
  fade.style.opacity = 1;
  setTimeout(() => {
    v.style.display = 'none'; c.style.display = 'block';
    qCur = phoneLive() ? phoneQ.slice() : [1, 0, 0, 0];
    state = 'pano'; draw();
    requestAnimationFrame(() => { fade.style.opacity = 0; });
  }, 650);
}
function onButton(i) {
  if (state === 'setup') return;
  if (i === 12) toPano();          // D-pad up
  else if (i === 9) reset();       // Options
}
addEventListener('keydown', e => {
  if (state === 'setup') return;
  if (e.code === 'ArrowUp') toPano();
  else if (e.code === 'KeyR') reset();
  else if (e.code === 'Space') spaceHeld = true;
});
addEventListener('keyup', e => { if (e.code === 'Space') spaceHeld = false; });

/* ---------- gamepad ---------- */
const prev = {};
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  stickActive = false;
  for (const p of pads) {
    if (!p) continue;
    for (let a = 0; a < Math.min(4, p.axes.length); a++) if (Math.abs(p.axes[a]) > 0.25) stickActive = true;
    p.buttons.forEach((b, i) => {
      const k = p.index + ':' + i;
      if (b.pressed && !prev[k]) onButton(i);
      prev[k] = b.pressed;
    });
  }
}

/* ---------- phone link (MQTT relay) ---------- */
const LINK_TOPIC = 'bakkara-gta6-x7k29q/q';
const BROKER = new URLSearchParams(location.search).get('broker') || 'wss://broker.hivemq.com:8884/mqtt';
let cli = null, phoneQ = [1, 0, 0, 0], lastMsg = 0, lastPing = 0, peerState = 'подключение к серверу';
const phoneLive = () => performance.now() - lastMsg < 1500;
const phoneLinked = () => performance.now() - lastPing < 3000;
function startPeer() {
  if (typeof mqtt === 'undefined') { peerState = 'mqtt не загрузился'; return; }
  cli = mqtt.connect(BROKER, { reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 20, clean: true });
  cli.on('connect', () => { peerState = 'ждёт телефон'; cli.subscribe(LINK_TOPIC, { qos: 0 }); });
  cli.on('reconnect', () => { peerState = 'переподключение'; });
  cli.on('offline', () => { peerState = 'нет связи с сервером'; });
  cli.on('error', e => { peerState = 'ошибка: ' + (e && e.message || e); });
  cli.on('message', (t, buf) => {
    let d; try { d = JSON.parse(buf.toString()); } catch (e) { return; }
    lastPing = performance.now();
    if (d && Array.isArray(d.q) && d.q.length === 4) { phoneQ = d.q; lastMsg = performance.now(); }
  });
}
startPeer();

/* ---------- panorama (same projection as the phone camera) ---------- */
const gl = c.getContext('webgl', { antialias: false });
const vs = `attribute vec2 p; varying vec2 v; void main(){ v=p; gl_Position=vec4(p,0.,1.); }`;
const fs = `precision highp float; varying vec2 v;
  uniform sampler2D tex; uniform mat3 R; uniform vec2 tanH; uniform vec4 pano; uniform vec2 cxy;
  void main(){
    vec3 d = R * normalize(vec3(v.x*tanH.x, v.y*tanH.y, -1.0));
    float yaw = atan(d.x, -d.z);
    float pitch = atan(d.y, length(d.xz));
    vec2 uv = vec2((cxy.x + yaw*pano.z)/pano.x, (cxy.y - pitch*pano.z)/pano.y);
    vec3 c = texture2D(tex, clamp(uv, 0.0, 1.0)).rgb;
    vec2 o = max(vec2(0.0), max(-uv, uv - 1.0));
    c *= 1.0 - smoothstep(0.0, 0.25, length(o));
    gl_FragColor = vec4(c, 1.0);
  }`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const pl = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
const loc = {}; ['R','tanH','pano','cxy','tex'].forEach(n => loc[n] = gl.getUniformLocation(prog, n));
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0]));
const img = new Image();
img.onload = () => { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img); };
img.src = PANO.src;
gl.uniform1i(loc.tex, 0);
gl.uniform4f(loc.pano, PANO.W, PANO.H, PANO.f, 0);
gl.uniform2f(loc.cxy, PANO.cx, PANO.cy);

function qSlerp(a, b, t) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0) { b = b.map(x => -x); d = -d; }
  if (d > 0.9995) { const r = a.map((x, i) => x + (b[i] - x) * t); const n = Math.hypot(...r); return r.map(x => x / n); }
  const th = Math.acos(d), s = Math.sin(th), wa = Math.sin((1 - t) * th) / s, wb = Math.sin(t * th) / s;
  return a.map((x, i) => x * wa + b[i] * wb);
}
function quatToMat3(q) {
  const [w, x, y, z] = q;
  return new Float32Array([
    1 - 2*(y*y + z*z), 2*(x*y + z*w),     2*(x*z - y*w),
    2*(x*y - z*w),     1 - 2*(x*x + z*z), 2*(y*z + x*w),
    2*(x*z + y*w),     2*(y*z - x*w),     1 - 2*(x*x + y*y)]);
}
let qCur = [1, 0, 0, 0];
function draw() {
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  gl.viewport(0, 0, w, h);
  qCur = qSlerp(qCur, phoneLive() ? phoneQ : qCur, SMOOTH);
  gl.uniformMatrix3fv(loc.R, false, quatToMat3(qCur));
  const tY = Math.tan(VFOV / 2);
  gl.uniform2f(loc.tanH, tY * w / h, tY);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- loop ---------- */
function loop() {
  pollPad();
  driveIntro();
  if (state === 'pano') draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
